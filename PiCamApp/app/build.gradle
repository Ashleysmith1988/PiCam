plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.picam.viewer'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.picam.viewer'
        minSdk 21          // Android 5.0+, covers every Galaxy Tab A
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
