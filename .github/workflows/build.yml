name: Build PiCam APK

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: PiCamApp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PiCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PiCam-apk
          path: PiCamApp/PiCam.apk
