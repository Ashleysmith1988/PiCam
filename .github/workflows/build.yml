name: Build PiCam APK

on:
  push:
    paths-ignore:
      - 'pi/**'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: PiCamApp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PiCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PiCam-apk
          path: PiCamApp/PiCam.apk

      - name: Publish release for the in-app updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PiCam build ${{ github.run_number }}
          files: PiCamApp/PiCam.apk
